server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    # Cấu hình Custom Error Page 404
    error_page 404 /404.html;

    # Bảo vệ tệp tin lỗi với chỉ thị internal
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
